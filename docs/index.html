<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0xB0 · Collector</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="glitch-overlay"></div>
    <div class="scanline"></div>

    <div id="loginPage" class="container">
        <div class="login-box">
            <div class="header">
                <div class="badge">● SECURE</div>
                <div class="logo">0xB0</div>
                <div class="subtitle">collector dashboard</div>
                <div class="divider"></div>
            </div>
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="USERNAME" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="PASSWORD" required />
                </div>
                <button type="submit" class="btn-primary">
                    <span>ACCESS</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <div id="loginError" class="login-error"></div>
            </form>
            <div class="footer">
                <span class="status">● system online</span>
                <span class="version">v2.4.1</span>
            </div>
        </div>
    </div>

    <div id="dashboardPage" style="display:none;">
        <div class="dash-container">
            <div class="dash-header">
                <h1><i class="fas fa-satellite-dish"></i> 0xB0 · Exfil</h1>
                <div class="dash-actions">
                    <span class="status-badge"><span class="dot"></span> Live</span>
                    <button id="downloadBtn" class="btn-outline"><i class="fas fa-file-archive"></i> Download ZIP</button>
                    <button id="deleteAllBtn" class="btn-outline btn-danger"><i class="fas fa-trash-alt"></i> Delete All</button>
                    <button id="refreshBtn" class="btn-outline"><i class="fas fa-sync-alt"></i> Refresh</button>
                    <button id="logoutBtn" class="btn-outline btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <div id="logContainer" class="log-area">
                <div class="placeholder"><i class="fas fa-spinner spinner"></i> Loading data...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
