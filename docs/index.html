<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0xB0 · Collector</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="glass">
    <div id="loginPage">
        <div class="logo">0xB0</div>
        <div class="sub">&#128737; Collector Dashboard</div>
        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Username" required />
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required />
            </div>
            <button type="submit" class="btn-primary">
                <i class="fas fa-arrow-right-to-bracket" style="margin-right:8px;"></i> Sign In
            </button>
            <div id="loginError" class="login-error"></div>
        </form>
    </div>
    <div id="dashboardPage">
        <div class="dash-header">
            <h1><i class="fas fa-satellite-dish" style="background:none;-webkit-text-fill-color:#58a6ff;margin-right:10px;"></i> 0xB0 · Exfil</h1>
            <div class="actions">
                <span class="status-badge"><span class="dot"></span> Live</span>
                <button id="refreshBtn" class="btn-outline"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button id="logoutBtn" class="btn-outline btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div id="logContainer" class="log-area">
            <div class="placeholder"><i class="fas fa-spinner spinner"></i> Loading data...</div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
